<div class="card w-100 h-100">
  <img [src]="product.imageURL" class="card-img-top square-image" alt="Image">
  <div class="card-body">
    <p class="card-text text-center m-1 text-truncate">
      {{product.name}}
    </p>
    <p class="card-text text-center fw-bold m-1">
      {{product.price}} zł
    </p>
  </div>
</div>
